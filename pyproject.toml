[project]
name = "nailong-llm-ban"
version = "0.1.0"
description = "QQ 群奶龙检测器：用视觉大模型识别并撤回奶龙图"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "websockets>=17.1",
]

[project.scripts]
nailong = "nailong.bot:main"
nailong-web = "nailong.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nailong"]
